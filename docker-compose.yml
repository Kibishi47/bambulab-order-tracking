services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bambulab-order-tracking
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_PATH: /app/data/bambulab.db
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
